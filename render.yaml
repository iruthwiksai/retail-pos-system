services:
  - type: web
    name: vijayalakshmi-minimart-pos
    runtime: node
    plan: free
    buildCommand: npm run postinstall
    startCommand: npm start
    envVars:
      - key: TZ
        value: Asia/Kolkata
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO
        value: "true"
